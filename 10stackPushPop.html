<!doctype html>
<html>

<head>
    <title>Stack Example</title>
</head>

<body>
    <input placeholder="Enter Number" id="id" />
    <button onclick="pushElement()">Push</button>
    <button onclick="Display()">Display</button>

    <script>
        let arr = [];
        let len = arr.length;
        let max = 5;

        function pushElement() {
            let num = Number(document.getElementById("id").value);
            if (len > max) {
                console.warn("Stack is Already full");
                return;
            }

            if (!isNaN(num) && num != 0) {
                arr.push(num);
            }
            document.getElementById("id").value = "";
        }

        function Display() {
            console.log(arr);
        }
    </script>
</body>

</html>
