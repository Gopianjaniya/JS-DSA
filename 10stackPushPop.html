<!doctype html>
<html>

<head>
    <title>Stack Example</title>
</head>

<body>
    <input placeholder="Enter Number" id="id" />
    <button onclick="pushElement()">Push</button>
    <button onclick="popElement()">Pop</button>
    <button onclick="Display()">Display</button>

    <script>
        let arr = [];
        let currentSize = arr.length;
        let max = 5;

        function pushElement() {
            let n = document.getElementById("id").value.trim();
            let num = Number(n);

            if (n === "" || isNaN(n)) {
                console.warn("Please enter number");
            }
            if (arr.length >= max) {
                console.warn(`Stack is Already full, ${num} is not add`);
                return;
            }

            if (!isNaN(num) && num != 0) {
                arr[currentSize] = num
                console.warn(`${arr[currentSize]} is add in Stack`)
                currentSize++

            }
            document.getElementById("id").value = "";
        }

        function popElement() {
            if (arr.length <= 0) {
                console.warn("Stack is Already empty");
                return;
            }
            console.warn(`${arr[currentSize-1]} is remove in Stack`)
            currentSize--
            arr.length = currentSize
        }

        function Display() {
            console.log(arr);
        }
    </script>
</body>

</html>
