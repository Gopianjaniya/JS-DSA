<!doctype html>
<html>

<head>
    <title>Array Insert Example</title>
</head>

<body>
    <script>
        let arr = [1, 2, 3, 4, 5, 6, 7];
        let search = 5;

        function linearSearch(arr, search) {
            for (let i = 0; i < arr.length; i++) {
                if (search == arr[i]) {
                    console.warn(`${search} element is available at index ${i}`);
                    return;
                }
            }
            console.warn(`${search} is not available in arr`);

        }
        linearSearch(arr, search);
    </script>
</body>

</html>
