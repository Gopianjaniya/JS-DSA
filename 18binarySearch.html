<!doctype html>
<html>

<head> </head>

<body>
    <script>
        let arr = [1, 2, 3, 4, 5, 6, 7, 8, 9];
        let search = 9;
        let start = 0;
        let end = arr.length - 1;

        function binarySearch(arr, search, start, end) {

            while (start <= end) {
                let mid = Math.floor((start + end) / 2);
                if (arr[mid] == search) {
                    console.warn("Found index: ", mid);
                    return;
                } else if (search < arr[mid]) {
                    end = mid - 1;
                } else {
                    start = mid + 1;
                }
            }
            console.warn("Not found");
        }
        binarySearch(arr, search, start, end);
    </script>
</body>

</html>
