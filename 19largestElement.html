<!doctype html>

<head> </head>

<body>
    <script>
        let arr = [-10, -5, -20, -1];

        function largestElement(arr) {
            let max = -Infinity;
            if (arr == null) {
                return null;
            }
            for (let i = 0; i < arr.length; i++) {
                if (max < arr[i]) {
                    max = arr[i];
                }
            }
            return max;
        }
        let result = largestElement(arr);
        console.warn(`${result} is largest Element in arr : ${arr}`);
    </script>
</body>

</html>
