<body>
    <script>
        // let arr = [10, 20, 30, 40, 50]
        let arr = [5, 5, 5];
        // let arr = [10]
        // let arr = [-10, -5, -20, -1]

        function secondLargestNum(arr) {
            let first = -Infinity;
            let second = -Infinity;
            if (!arr || arr.length < 2) {
                return -1;
            }
            for (let i = 0; i < arr.length; i++) {
                if (first < arr[i]) {
                    second = first;
                    first = arr[i];
                } else if (second < arr[i] && arr[i] !== first) {
                    second = arr[i];
                }
            }
            if (first == second) {
                return -1;
            }
            if (second == -Infinity) {
                return -1;
            }

            return second;
        }
        let result = secondLargestNum(arr);
        if (result !== -1) {
            console.warn(`${result} is second Largest Value in arr : ${arr}`);
        } else {
            console.warn(`${result}`);
        }
    </script>
</body>
