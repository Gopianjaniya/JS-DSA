<body>
    <script>
        let arr = [1, 2, 3, 6, 4, 5];

        function isSorted(arr) {
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] > arr[i + 1]) {
                    return false;
                }
            }
            return true;
        }
        let result = isSorted(arr);
        console.warn(`${result} `);
    </script>
