<body>
    <script>
        let arr = [1, -2, 0, 5, -7, 0];

        function countPNZNum(arr) {
            let positive = 0,
                negative = 0,
                zero = 0;
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] > 0) {
                    positive++;
                } else if (arr[i] < 0) {
                    negative++;
                } else {
                    zero++;
                }
            }
            return {
                positive,
                negative,
                zero,
            };
        }
        let result = countPNZNum(arr);
        console.warn(result);
    </script>
</body>

</html>
