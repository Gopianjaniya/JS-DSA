<body>
    <script>
        let arr = [1, 2, 2, 3, 2, 4];
        let target = 2;

        function findFrequency(arr, target) {
            let count = 0;
            for (let i = 0; i < arr.length; i++) {
                if (target === arr[i]) {
                    count++;
                }
            }
            return count;
        }
        let result = findFrequency(arr, target)
        console.warn(`${result}`)
    </script>
