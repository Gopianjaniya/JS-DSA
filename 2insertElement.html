<!doctype html>
<html>

<head>
    <title>Array Insert Example</title>
</head>

<br>
<h2>Array me Element Insert</h2>
<input placeholder="enter number" id="id1" />
<button onclick="InsertElement()">Add Element last</button></br>
</br>
<!-- insert with position -->
<input placeholder="enter number" id="id2" />
<input placeholder="enter position" id="position" />
<button onclick="insertWithPosition()">Add Element Position</button></br>
</br>
<button onclick="Display()">Display</button>


<script>
    let arr = [];
    let currentSize = 0;

    function InsertElement() {
        let ele = document.getElementById("id1").value;
        arr[currentSize] = ele;
        currentSize++;
        document.getElementById("id1").value = '';
    }

    function insertWithPosition() {
        let position = document.getElementById('position').value
        let newEle = document.getElementById('id2').value
        for (let i = arr.length - 1; i >= 0; i--) {
            if (i >= position) {
                arr[i + 1] = arr[i]
                if (i == position) {
                    arr[i] = newEle
                }
            }
        }

        document.getElementById('position').value = ''
        document.getElementById('id2').value = ''

    }

    function Display() {
        console.warn(arr);
    }
</script>
</body>

</html>
