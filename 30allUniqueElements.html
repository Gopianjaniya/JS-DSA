<body>
    <script>
        let arr = [1, 2, 3, 4, 1, 2, 3];

        function allUniqueElements(arr) {
            let hashMap = {};
            let unique = [];
            for (let i = 0; i < arr.length; i++) {
                if (hashMap[arr[i]]) {
                    hashMap[arr[i]]++;
                } else {
                    hashMap[arr[i]] = 1;
                }
            }
            for (let i = 0; i < arr.length; i++) {
                if (hashMap[arr[i]] === 1) {
                    unique.push(arr[i]);
                }
            }
            return unique;
        }
        let result = allUniqueElements(arr);
        console.warn(result);
    </script>
</body>
