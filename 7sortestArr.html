<!doctype html>
<html>

<head>
    <title>Array Sort Example</title>
</head>

<body>



    <script>
        let arr = [1, 6, 2, 3, 8, 31, 9, 4, 5, 30, 39]

        function beforeSortArr() {
            console.log(`Before arr =>`, arr);
        }

        function sortArr() {
            for (let i = 0; i < arr.length; i++) {
                for (let j = i; j < arr.length; j++) {
                    if (arr[i] > arr[j + 1]) {
                        let temp = arr[i]
                        arr[i] = arr[j + 1]
                        arr[j + 1] = temp
                    }
                }
            }
        }

        function afterSortArr() {
            console.log(`After Sort arr =>`, arr);
        }
        beforeSortArr()
        sortArr()
        afterSortArr()
    </script>
</body>

</html>
